# This repository's own gate. `gate` is the only required check; see
# standards/ci.md for why every rule below is here.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR makes its in-flight run obsolete. Runs on main are the
# record that a commit was gated, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Without an explicit `shell: bash`, run blocks get `bash -e` with no
# pipefail, so a failing command piped into another reports success.
defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.12.15"
  PRE_COMMIT_VERSION: "4.6.2"

jobs:
  hooks:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: pre-commit (the same hooks that run locally)
        run: uvx "pre-commit@${PRE_COMMIT_VERSION}" run --all-files --show-diff-on-failure

  # The pre-commit hook sees only what is being committed. A secret that was
  # committed and later deleted is still in the history, so CI scans all of it.
  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: v8.30.1
      # The sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's asset digest.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          ver="${GITLEAKS_VERSION#v}"
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${ver}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      # -v with --redact names the rule and file in the log, with the secret's
      # bytes masked, so a red run says what to fix.
      - name: Secrets (gitleaks, full history)
        run: gitleaks git --no-banner -v --redact --exit-code 1 .

  # The one check the ruleset requires. Requiring each job by name is
  # brittle: renaming, adding or skipping a job silently changes what "green"
  # means, and a required check that never reports blocks merging forever.
  gate:
    name: gate
    if: always()
    needs: [hooks, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every required job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" != "success" ]; then
              echo "::error::a required job did not pass (${RESULTS})"
              exit 1
            fi
          done
